# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 50
    ignore:
      - dependency-name: "eslint"
        versions:
          - ">= 10"
      - dependency-name: "@eslint/js"
        versions:
          - ">= 10"
      - dependency-name: "react-router"
        versions:
          - ">= 7"
      - dependency-name: "react-router-dom"
        versions:
          - ">= 7"
    groups:
      npm-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      ionic:
        patterns:
          - "@ionic/react"
          - "@ionic/react-router"
      eslint:
        patterns:
          - "eslint"
          - "@eslint/js"
      react-router:
        patterns:
          - "react-router"
          - "react-router-dom"
      capacitor:
        patterns:
          - "@capacitor/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      i18next:
        patterns:
          - "i18next"
          - "react-i18next"

  - package-ecosystem: "npm"
    directory: "/docker/runtime"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 10
    groups:
      npm-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 10
    groups:
      actions-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      codeql-action:
        patterns:
          - "github/codeql-action*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "node"
        versions:
          - ">= 25, < 27"
    groups:
      docker-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 10
    groups:
      devcontainers-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
