name: mariokart-integration

services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: mariokart
      POSTGRES_PASSWORD: mariokart
      POSTGRES_DB: mariokart
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mariokart"]
      interval: 2s
      timeout: 5s
      retries: 30

  schedule:
    image: ${SCHEDULE_IMAGE:-eintoast/mariokart_schedule:latest}

  backend:
    image: ${BACKEND_IMAGE:-eintoast/mariokart_backend:latest}
    depends_on:
      db:
        condition: service_healthy
      schedule:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: mariokart
      DB_USER: mariokart
      DB_PASSWORD: mariokart
      SECRET_KEY: bWFyaW9rYXJ0LWludGVncmF0aW9uLXRlc3RzLXNlY3JldC1rZXkhIQ==
      USER_NAME: admin
      USER_PASSWORD: integration-password
      SCHEDULE_PROTOCOL: http
      SCHEDULE_HOST: schedule
      SCHEDULE_PORT: 8000
      VAPID_PUBLIC_KEY: BEaLYH2kZLfuvegOzuYzhKULOwkP7gKF80vHgdiFsgrzXdhr79pCt7Yl7XKBVMiiwrhtS-IvvtEIG0SnNK0Suj4
      VAPID_PRIVATE_KEY: CbLUG0NwwAqLaOKWavgkK4ysxiIR7HSm4ui2SSmOU5Y
      VAPID_CONTACT_EMAIL: mailto:integration@example.com
      DOMAIN: http://localhost:5173
      COOKIE_SECURE: "false"
